name: Continuous Integration

on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.target-type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            os: ubuntu-22.04
            target-type: template_debug
            cmake-build-type: Debug

          - platform: windows
            arch: x86_64
            os: windows-latest
            target-type: template_release
            cmake-build-type: Release

    runs-on: ${{ matrix.os }}

    env:
      # Pinned libmpv Windows build — update by changing these two values together
      MPV_RELEASE_TAG: "20260331"
      MPV_GIT_HASH: "9465b30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Linux ───────────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libmpv-dev libegl-dev libgles2-mesa-dev

      # ── Windows ─────────────────────────────────────────────────────────────
      # Use the vcpkg pre-installed on the runner (VCPKG_INSTALLATION_ROOT) instead
      # of bootstrapping the submodule — avoids PATH collision with the runner's vcpkg binary.
      - name: Cache vcpkg packages (Windows)
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
          key: vcpkg-windows-x86_64-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg packages (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: vcpkg install --triplet x64-windows --vcpkg-root $env:VCPKG_INSTALLATION_ROOT

      - name: Cache libmpv dev package (Windows)
        if: matrix.platform == 'windows'
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: dependencies/mpv-dev
          key: mpv-dev-windows-x86_64-${{ env.MPV_RELEASE_TAG }}-${{ env.MPV_GIT_HASH }}

      - name: Download libmpv (Windows, cache miss)
        if: matrix.platform == 'windows' && steps.cache-mpv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $filename = "mpv-dev-x86_64-${{ env.MPV_RELEASE_TAG }}-git-${{ env.MPV_GIT_HASH }}.7z"
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/${{ env.MPV_RELEASE_TAG }}/$filename"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -o"dependencies/mpv-dev" -y

      # ── CMake configure ──────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DGODOTCPP_TARGET=${{ matrix.target-type }}

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} `
            -DGODOTCPP_TARGET=${{ matrix.target-type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel

      # ── Collect runtime dependencies (Windows) ───────────────────────────────
      - name: Copy Windows runtime DLLs
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $outdir = "godot_project/bin/windows"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null
          # libmpv runtime DLL
          Copy-Item "dependencies/mpv-dev/libmpv-2.dll" $outdir -ErrorAction SilentlyContinue
          # ANGLE runtime DLLs (from vcpkg)
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -Filter "*.dll" |
            Where-Object { $_.Name -in @("libEGL.dll", "libGLESv2.dll") } |
            Copy-Item -Destination $outdir

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot_mpv-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target-type }}
          path: godot_project/bin/${{ matrix.platform }}/
