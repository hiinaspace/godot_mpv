name: Build All Targets

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.target-type }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows]
        arch: [x86_64]
        target-type: [template_debug, template_release]
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
          - target-type: template_debug
            cmake-build-type: Debug
          - target-type: template_release
            cmake-build-type: Release

    runs-on: ${{ matrix.os }}

    env:
      MPV_RELEASE_TAG: "20260331"
      MPV_GIT_HASH: "9465b30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Linux ───────────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libmpv-dev libegl-dev libgles2-mesa-dev

      # ── Windows — MSYS2 UCRT64 ──────────────────────────────────────────────
      - name: Setup MSYS2 with ANGLE (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-angleproject

      - name: Cache libmpv dev package (Windows)
        if: matrix.platform == 'windows'
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: dependencies/mpv-dev
          key: mpv-dev-windows-x86_64-${{ env.MPV_RELEASE_TAG }}-${{ env.MPV_GIT_HASH }}

      - name: Download libmpv (Windows, cache miss)
        if: matrix.platform == 'windows' && steps.cache-mpv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $filename = "mpv-dev-x86_64-${{ env.MPV_RELEASE_TAG }}-git-${{ env.MPV_GIT_HASH }}.7z"
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/${{ env.MPV_RELEASE_TAG }}/$filename"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -o"dependencies/mpv-dev" -y

      # ── CMake configure ──────────────────────────────────────────────────────
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DGODOTCPP_TARGET=${{ matrix.target-type }}

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.cmake-build-type }} \
            -DGODOTCPP_TARGET=${{ matrix.target-type }} \
            -DCMAKE_PREFIX_PATH="/ucrt64"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      # ── Collect runtime dependencies (Windows) ───────────────────────────────
      - name: Copy Windows runtime DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          outdir="godot_project/bin/windows"
          mkdir -p "$outdir"
          cp dependencies/mpv-dev/libmpv-2.dll "$outdir/" || true
          cp /ucrt64/bin/libEGL.dll /ucrt64/bin/libGLESv2.dll "$outdir/"

      # ── Upload per-build artifact ────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot_mpv-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target-type }}
          path: godot_project/bin/

  # Merge all platform artifacts and optionally publish a GitHub Release
  merge:
    name: Merge artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge build artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: godot_mpv
          pattern: godot_mpv-*
          delete-merged: true

      # Only create a GitHub Release when triggered by a version tag
      - name: Download merged artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: godot_mpv
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -r ../godot_mpv-${{ github.ref_name }}.zip .
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "godot_mpv ${{ github.ref_name }}" \
            --generate-notes \
            ../godot_mpv-${{ github.ref_name }}.zip
